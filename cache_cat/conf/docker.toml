node_id = 1

[redis]
#全局統一 redis哨兵的master名字
sentinel-master-name = "cat"
redis-port = 6379
tls-port = 6479

#在没有请求到来时 多少秒进行一次key的清理 0表示不清理
cleaning-interval = 100
databases = 16
#requirepass = "123"

[raft]
address = "0.0.0.0:5001"
advertise-host = "0.0.0.0"
single = true
join = []

log-path = "C:/tmp/raft/cache-cat/1"

#选举超时时间，节点之间的时钟偏移不能超过该值 需要大于500
election-timeout = 799
#超过这个值将会直接进行快照，为0代表用不快照
snapshot-policy = 50000
#超过这个阈值表示严重落后，主节点会将快照发给从节点，而不是增量同步。需要大于snapshot_policy,防止快照还没生成。
replication-lag-threshold = 60000
