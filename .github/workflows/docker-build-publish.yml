name: Build and Publish Docker Image

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
jobs:
  build:
    uses: ./.github/workflows/just-compile.yaml
    
  push-docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: ./dist

      - run: |
          mv dist/cache_cat-x86_64-unknown-linux-musl dist/linux/amd64
          mv dist/cache_cat-aarch64-unknown-linux-musl dist/linux/arm64
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2
        with:
          platforms: all

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to GHCR
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build docker and push to GHCR
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64, linux/arm64/v8
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ github.repository }}
