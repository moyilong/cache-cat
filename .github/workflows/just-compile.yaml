name: Build and Upload Artifacts

on:
  workflow_dispatch:
  workflow_call:
jobs:
  build-and-push:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - toolchain: x86_64-unknown-linux-musl
            target: linux-amd64
          - toolchain: riscv64gc-unknown-linux-musl
            target: linux-riscv64
          - toolchain: aarch64-unknown-linux-musl
            target: linux-arm64-v8

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.toolchain }}

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.13.0

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-zigbuild
        run: cargo install cargo-zigbuild --locked

      - name: Build
        run: |
          cargo zigbuild --release --target ${{ matrix.toolchain }}

      - name: Upload artifact CacheCat
        uses: actions/upload-artifact@v4
        with:
          name: cache_cat-${{matrix.target}}
          path: |
            target/${{matrix.toolchain}}/release/cache_cat
            target/${{matrix.toolchain}}/release/cache_cat_ping
